query ElementDetail($id: String!) {
  element(id: $id) {
    id
    name
    icon
    description
    completed
    uri
    labels
    trips {
      id
    }
    location {
      id
      address
      latitude
      longitude
      placeId
    }
    photos {
      id
      thumbnail
      regular
      description
    }
    schedule {
      id
      allDay
      startDate
      endDate
      startTime
      endTime
      startTz
      endTz
    }
    metadata {
      type
      number
      reservation
      seat
      paymentDetails
      address
      departureLocation
      arrivalLocation
    }
  }
}
