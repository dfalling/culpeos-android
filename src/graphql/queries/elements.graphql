query Elements(
  $bounds: GeoBounds
  $tripIds: [String!]
  $inTrip: Boolean
  $shared: Boolean
  $labels: [String!]
  $labelsMatch: LabelMatchMode
  $search: String
  $hasSchedule: Boolean
  $completed: Boolean
  $deleted: Boolean
) {
  elements(
    bounds: $bounds
    tripIds: $tripIds
    inTrip: $inTrip
    shared: $shared
    labels: $labels
    labelsMatch: $labelsMatch
    search: $search
    hasSchedule: $hasSchedule
    completed: $completed
    deleted: $deleted
  ) {
    id
    name
    icon
    labels
    location {
      id
      latitude
      longitude
    }
  }
}
