# Tool versions for this project, managed by mise (https://mise.jdx.dev).
# Run `mise install` after cloning to install everything.

[tools]
# Single source of truth for tool versions: CI installs these via
# jdx/mise-action, so local builds and CI can't drift.
# Node stays alongside bun because Metro and Gradle's react.gradle plugin
# shell out to `node` directly — bun is the package manager, not the runtime.
node = "24"
bun = "1.3.14"
java = "temurin-25.0.4+7.0.LTS"

[env]
# On JDK 24+ the JVM warns on stderr when JNA calls System::load (JEP 472).
# AGP forks the prefab CLI during configureCMake* and fails the build on any
# unrecognized stderr line, so the warning breaks `bun run android`. AGP does
# whitelist the "Picked up JAVA_TOOL_OPTIONS" line, making this env var the
# supported way to grant native access in forked JVMs until the AGP fix
# (issuetracker b/469503601) ships in a release.
JAVA_TOOL_OPTIONS = "--enable-native-access=ALL-UNNAMED"
